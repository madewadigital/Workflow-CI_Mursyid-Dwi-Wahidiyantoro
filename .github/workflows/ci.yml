name: Model Retraining CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  retrain-model:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0 scikit-learn pandas numpy

      - name: Retrain Model using MLflow Project
        run: |
          mlflow run MLProject --env-manager local -P n_estimators=100 -P max_depth=5

      - name: Verify Model Training
        run: |
          echo "Model training completed and verified in CI workflow."
